<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Think It Platform - Business REST API Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; background: #0F172A; }
    .swagger-ui { filter: invert(88%) hue-rotate(180deg); }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
    const spec = {
      openapi: '3.1.0',
      info: {
        title: 'Think It - AI Meeting Intelligence Platform Business API',
        version: '2.0.0',
        description: 'Production OpenAPI Specification for Think It Multilingual Speech Intelligence, Custom Reports, RAG Copilot, and Cloud Health Suite.'
      },
      servers: [
        { url: 'https://projectplugin-api.onrender.com', description: 'Production API Server' },
        { url: 'http://localhost:3000', description: 'Local Development Server' }
      ],
      tags: [
        { name: 'Cloud Health Suite', description: 'Enterprise readiness, liveness, and deep diagnostic health probes' },
        { name: 'Speech Intelligence', description: '10-step speech processing, VAD, speaker diarization, auto-language detection, & code-switching normalization' },
        { name: 'Custom Reports', description: 'Audio/Video asset uploader, AI folder report generator, and ZIP/DOCX/PDF exports' },
        { name: 'AI Copilot (RAG)', description: 'Grounded conversational enterprise search with citations and vector memory' }
      ],
      paths: {
        '/health': {
          get: {
            tags: ['Cloud Health Suite'],
            summary: 'Comprehensive System Health Status',
            description: 'Returns database status, provider health, queue health, uptime, and system version.',
            responses: {
              '200': { description: 'System Healthy' },
              '503': { description: 'Service Degraded' }
            }
          }
        },
        '/health/live': {
          get: {
            tags: ['Cloud Health Suite'],
            summary: 'Kubernetes Liveness Probe',
            responses: { '200': { description: 'Process Alive' } }
          }
        },
        '/health/ready': {
          get: {
            tags: ['Cloud Health Suite'],
            summary: 'Kubernetes Readiness Probe',
            responses: { '200': { description: 'System Ready' }, '503': { description: 'Database Disconnected' } }
          }
        },
        '/health/deep': {
          get: {
            tags: ['Cloud Health Suite'],
            summary: 'Deep Subsystem Diagnostic Check',
            responses: { '200': { description: 'All Subsystems Online' } }
          }
        },
        '/api/speech/process': {
          post: {
            tags: ['Speech Intelligence'],
            summary: 'Process Multilingual Speech & Code-Switching Dialogue',
            description: 'Executes 10-step Speech Intelligence pipeline, VAD, speaker diarization, auto-language detection, and normalized English translation.',
            requestBody: {
              required: true,
              content: {
                'application/json': {
                  schema: {
                    type: 'object',
                    required: ['textChunk'],
                    properties: {
                      meetingId: { type: 'string', example: 'mtg-101' },
                      speakerName: { type: 'string', example: 'Aparna' },
                      textChunk: { type: 'string', example: 'Sprint demo Friday kazhinju release cheyyam.' }
                    }
                  }
                }
              }
            },
            responses: {
              '200': { description: 'Speech processing successful' },
              '500': { description: 'Processing Error' }
            }
          }
        },
        '/api/custom-reports/process': {
          post: {
            tags: ['Custom Reports'],
            summary: 'Process Media Asset & Synthesize Folder Report',
            description: 'Analyzes uploaded meeting assets and generates Executive Summary, MoM, Action Items, Decisions, Risks, and Recommendations.',
            responses: {
              '200': { description: 'Custom Report Created' }
            }
          }
        },
        '/api/copilot/chat': {
          post: {
            tags: ['AI Copilot (RAG)'],
            summary: 'Grounded Conversational Copilot Query',
            description: 'Answers organizational questions grounded in meeting vector memory citations.',
            requestBody: {
              required: true,
              content: {
                'application/json': {
                  schema: {
                    type: 'object',
                    required: ['question'],
                    properties: {
                      question: { type: 'string', example: 'What decisions were made regarding release dates?' }
                    }
                  }
                }
              }
            },
            responses: {
              '200': { description: 'Copilot Response Generated' }
            }
          }
        }
      }
    };

    window.onload = () => {
      SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
